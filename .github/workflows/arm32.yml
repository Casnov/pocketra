The error happens because your GitHub Actions workflow is requesting Android NDK version `r28c`, but SCons is specifically hardcoded to look for the precise build version string **`28.1.13356709`** (which corresponds to NDK r28).

To fix this, update your workflow file's `ndk-version` field to explicitly match the exact version string string `28.1.13356709`.

Here is the corrected workflow file:

```yaml
name: Build Android arm32

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-arm32:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python & SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install scons

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: 28.1.13356709
          link-to-sdk: true

      - name: Build C++ Native Components (gdext)
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd gdext
          scons platform=android target=template_release arch=arm32

      - name: Upload Compiled Binaries
        uses: actions/upload-artifact@v4
        with:
          name: pocketra-android-arm32
          path: |
            gdext/**/*.so
            gdext/bin/

```
