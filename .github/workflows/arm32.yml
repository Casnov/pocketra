name: Build Android arm32

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-arm32:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python & SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install scons

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28b
          link-to-sdk: true

      - name: Build C++ Native Components (gdext)
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd gdext
          scons platform=android target=template_release arch=arm32
          
          # Debug: List contents to see where binaries are generated
          echo "Listing gdext directory contents:"
          find . -maxdepth 3

      - name: Upload Compiled Binaries
        uses: actions/upload-artifact@v4
        with:
          name: pocketra-android-arm32
          path: |
            gdext/**/*.so
            gdext/bin/

```
