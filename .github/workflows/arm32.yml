name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python & SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install scons

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28b
          link-to-sdk: true

      - name: Build C++ Native Components (gdext)
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd gdext
          scons platform=android target=template_release arch=arm32

      # --- NEW: GODOT EXPORT STEP ---
      - name: Download and Setup Godot Engine
        run: |
          # Change GODOT_VERSION to match your project's version (e.g., 4.3, 4.4, etc.)
          GODOT_VERSION="4.3-stable"
          
          # Download Godot Linux server/headless binary and export templates
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          
          unzip Godot_v${GODOT_VERSION}_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          
          # Install export templates for Godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION%.*}
          unzip Godot_v${GODOT_VERSION}_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION%.*}/

      - name: Export Android APK
        run: |
          mkdir -p game/build
          cd game
          
          # Force Godot to pre-import assets so the export doesn't crash on headless runner
          godot --headless --editor --quit || true
          
          # Export the release APK using your export preset name (e.g., "Android")
          godot --headless --export-release "Android" build/pocketra.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketra-android-apk
          path: game/build/pocketra.apk
