name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python & SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install scons

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28b
          link-to-sdk: true

      - name: Build C++ Native Components (gdext)
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd gdext
          # 1. Build for Android arm32
          scons platform=android target=template_release arch=arm32
          
          # 2. Build for Linux so the headless Godot editor can load classes during export
          scons platform=linux target=template_release arch=x86_64

      - name: Download and Setup Godot Engine & Android Templates
        run: |
          GODOT_VERSION="4.7-stable"
          
          # 1. Download Godot Headless Editor
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip Godot_v${GODOT_VERSION}_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          
          # 2. Download Export Templates (includes android_source.zip)
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          
          # 3. Place templates in the correct directory expected by Godot 4.7
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          unzip Godot_v${GODOT_VERSION}_export_templates.tpz
          mv templates/* "$TEMPLATE_DIR/"

      - name: Export Android APK
        run: |
          mkdir -p game/build
          cd game
          
          # Initialize the project once in headless mode to clear script parse errors & import assets
          godot --headless --editor --quit || true
          
          # Automatically install the Android build template (generates game/android/ locally)
          godot --headless --install-android-build-template || true
          
          # Export the final release APK
          godot --headless --export-release "Android" build/pocketra.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketra-android-apk
          path: game/build/pocketra.apk
